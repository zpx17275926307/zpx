<!DOCTYPE html>
<!-- VS Code编写的Web页面：实时显示西门子PLC数据块变量 -->
<!-- 纯HTML+原生JS，无框架，无依赖，新手友好，复制即用 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>✅ 西门子PLC数据实时显示 - Web可视化界面</title>
    <style>
        /* 简单美化页面，数据显示清晰，工业风，新手不用改 */
        body { padding: 40px; font-family: "微软雅黑"; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
        h1 { color: #0066cc; text-align: center; margin-bottom: 30px; }
        .plc-data-item { font-size: 20px; margin: 20px 0; padding: 15px; border-left: 5px solid #0099ff; background: #f9f9f9; }
        .data-value { color: #e63946; font-weight: bold; font-size: 24px; margin-left: 10px; }
        .status { color: #2a9d8f; font-size: 18px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>西门子PLC 数据块变量 实时监控</h1>
        <!-- PLC数据显示区域：变量地址+实时数值 -->
        <div class="plc-data-item">
            PLC数据块变量地址：<span style="color:#0066cc">速度</span>
            <br>
            PLC实时数值：<span class="data-value" id="plcValue">--</span>
        </div>
        <!-- 连接状态显示 -->
        <div class="status" id="connStatus">🔴 未连接Node-RED</div>
    </div>

    <script>
        // ===================== 核心配置（新手只改这里！）=====================
        // 1. Node-RED的WebSocket地址，路径和你在Node-RED里配置的【websocket out】的Path一致！
        // 格式：ws://localhost:1880/你的路径  我之前配置的是/plcws，所以写这个
        const wsUrl = "ws://localhost:1880/plcws";
        // 2. PLC变量地址，和你读取的一致，仅用于显示，可改
        const plcDbAddr = "DB1.速度";

        // ===================== WebSocket核心代码：实时接收PLC数据 =====================
        // 获取页面上的显示元素
        const plcValueDom = document.getElementById('plcValue');
        const connStatusDom = document.getElementById('connStatus');
        // 创建WebSocket对象，建立长连接
        const ws = new WebSocket(wsUrl);

        // ✅ 连接成功：页面提示已连接
        ws.onopen = function() {
            connStatusDom.innerHTML = "🟢 已连接Node-RED，正在实时接收PLC数据...";
            connStatusDom.style.color = "#2a9d8f";
        };

        // ✅ 核心：收到Node-RED推送的PLC数据，自动更新页面显示
        ws.onmessage = function(msg) {
            // 解析PLC数据（JSON格式）
            const plcData = JSON.parse(msg.data);
            // 把PLC数值显示在页面上
            plcValueDom.innerHTML = plcData.plc_data;
            // 控制台打印数据，方便调试（可选）
            console.log("PLC实时数据：", plcData);
        };

        // ✅ 连接关闭/失败：页面提示
        ws.onclose = function() {
            connStatusDom.innerHTML = "🔴 连接断开，正在重试...";
            connStatusDom.style.color = "#e63946";
        };
        ws.onerror = function() {
            connStatusDom.innerHTML = "🔴 连接失败，请检查Node-RED是否运行";
            connStatusDom.style.color = "#e63946";
        };
    </script>
</body>
</html>
